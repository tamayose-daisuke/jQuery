<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    // 回答はここに書いてね
  let failHtml =
  `
    <p class="text">逃げられてしまった...</p>
    <button class="btn mt" data-js="reset">戻る</button>
  `
  // 「ポケモンを探す」後の画面表示
  let encountHtml =
  `
    <p class="name"></p>
    <div>
      <img class="img" src="" alt="">
    </div>
    <div>
      <button class="btn" id="catch">捕まえる</button>
      <button class="btn" data-js="reset">逃げる</button>
    </div>
  `

  // 「捕まえる」成功時の画面表示
  let doneHtml =
  `
    <p class="name">ゲットしました</p>
    <div>
      <img class="img" src='' alt="">
    </div>
    <button class="btn" data-js="reset">戻る</button>
  `
	// 戻るを押したら最初の画面に戻る
   $(document).on('click', '.btn', function() {
		$('.wrapper').html('<button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>');
		});  
		


    $(document).on('click', '.search-btn' ,function(){
			let num = Math.floor(Math.random() * 151); 
			 //ポケモンを探すを押したらencountHtmlを表示する。
			
      //通信で情報を取得する。
    $.ajax({
      url: `https://pokeapi.co/api/v2/pokemon/${num}`,//文字の中に変数を組み込む方法
      method: 'GET'
      }).done(function(res) {
				let imageUrl = res.sprites.front_default; // 画像のURL
				let name = res.name; 
				$('#wrapper').html(encountHtml);  // HTML書き換え
				$('.wrapper .img').attr('src', imageUrl)  // 画像
      
      $.ajax({
				url: `https://pokeapi.co/api/v2/pokemon-species/${num}/`,
				method: 'GET'
			}).done(function(res) {
        $('.wrapper .name').text(res.names[0].name);  // 名前（日本語）
        // res.species.url はモンスターの日本語が取得できるAPIを叩くためのurl
      
      $.ajax({
        url: 'https://pokeapi.co/api/v2/pokemon/1',
        method: 'GET'
      }).done(function(res) {
        $(document).on('click','#catch',function(){
          if(Math.random()<0.5){
            $.ajax({
              url: 'https://pokeapi.co/api/v2/item/4',
              method: 'GET'
            }).done(function(res){
              console.log(res.sprites.default);
              $('#wrapper').html(doneHtml);
              $(' img').attr('src', 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png')
            }).fail(function(err){
              console.log(err);
            });
          }else{
            $('#wrapper').html(failHtml);
          }
        })
      })

      
			})
			}).fail(function(err){
				console.log(err);
      });
				
			
          

        // $.ajax({
        //   url: 'https://pokeapi.co/api/v2/item/4',
        //   method: 'GET'
        // }).done(function(res){
        //   console.log(res);
        // }).fail(function(err){
        //   console.log(err);
        // })

  });
  
  </script>
</body>
</html>
